<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;border-radius:10px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.n{font-size:26px;font-weight:700;color:var(--ac)}.l{font-size:12px;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:22px;font-weight:700;text-align:center;padding:14px 6px;direction:auto;word-break:break-word}
.tag{font-size:12px;color:var(--mu);text-align:center}
.opt{display:block;width:100%;margin-top:8px;text-align:start;font-size:16px;direction:auto}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}

label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=color]{height:42px;padding:2px}textarea{min-height:90px}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
.msg{font-weight:600;text-align:center;margin:10px 0}
.hide{display:none}
</style>
</head>

<div class="ft">© جميع الحقوق محفوظة للهيئة الطلابية – كلية الطب البشري، جامعة حمص</div>

function daysLeft(){return Math.max(1,Math.ceil((new Date(S.set.dl+"T23:59:59")-Date.now())/DAY))}
function quota(){const un=terms().filter(t=>!card(t).seen).length;const q=S.set.pd>0?S.set.pd:Math.ceil(un/Math.max(1,daysLeft()-5));return Math.max(0,Math.min(un,q-S.day.n))}

 $("pb").style.width=(T.length?done/T.length*100:0)+"%";$("pt").textContent=done+" من "+T.length+" مصطلح";$("cnt").textContent="عدد المصطلحات الحالي: "+T.length}
function show(id){["home","sess","set"].forEach(x=>$(x).classList.toggle("hide",x!==id));$("t1").classList.toggle("on",id!=="set");$("t2").classList.toggle("on",id==="set");if(id==="home")home()}

let Q=[],last="",t0=0,cur=null,stat={};

$("quit").onclick=()=>{save();show("home")};
function next(){
 if(!Q.length){$("card").innerHTML='<div class="msg">خلصت جلسة اليوم ✅</div><div class="row"><span>صح وسريع</span><b>'+stat.k+'</b></div><div class="row"><span>يحتاج إعادة</span><b>'+stat.w+'</b></div>';$("left").textContent="";save();return}
 let i=Q.findIndex(x=>key(x.t)!==last);if(i<0)i=0;cur=Q.splice(i,1)[0];last=key(cur.t);
 $("left").textContent="المتبقي: "+(Q.length+1);
 const t=cur.t,el=$("card");
 if(cur.learn){el.innerHTML='<div class="tag">كلمة جديدة</div>'+t.map((v,k)=>'<div class="row"><b>'+LN[k]+'</b><span>'+v+'</span></div>').join("")+'<button class="p" id="ok" style="width:100%;margin-top:12px">فهمتها</button>';
  $("ok").onclick=()=>{const c=card(t);c.seen=1;c.b=0;S.day.n++;Q.splice(Math.min(3,Q.length),0,{t,tries:0});save();next()};return}
 const a=Math.random()*3|0,b=[0,1,2].filter(x=>x!==a)[Math.random()*2|0];
 const pool=shuf(terms().filter(x=>x[b]!==t[b]&&x[b]!==t[a])).map(x=>x[b]);
 const opts=shuf([t[b]].concat([...new Set(pool)].slice(0,3)));
 el.innerHTML='<div class="tag">'+LN[a]+' ← '+LN[b]+'</div><div class="q">'+t[a]+'</div><div id="os"></div>';
 opts.forEach(o=>{const bt=document.createElement("button");bt.className="opt";bt.textContent=o;bt.onclick=()=>ans(bt,o===t[b],opts);$("os").appendChild(bt)});
 t0=Date.now();cur.b=b}
function ans(btn,ok,opts){
 const dt=(Date.now()-t0)/1000,t=cur.t,c=card(t);
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===t[cur.b])x.classList.add("ok")});
 if(!ok)btn.classList.add("no");
 let g=!ok?"forgot":dt<=5?"know":dt<=10?"half":"weak";
 const msgs={forgot:"غلط — رح ترجع بعد شوي",know:"صح وسريع — ممتاز",half:"صح بس بطيء — رح تنعاد",weak:"صح بس تأخرت كتير — رح تنعاد"};
 if(g==="know"){c.b=Math.min(5,c.b+1);stat.k++}
 else{stat.w++;if(g==="forgot"){c.b=0}else if(g==="weak"){c.b=Math.max(1,c.b-1)}else{c.b=Math.max(1,c.b)}
  const pos=g==="forgot"?3+(Math.random()*3|0):g==="weak"?6+(Math.random()*3|0):10+(Math.random()*3|0);
  if(cur.tries<3)Q.splice(Math.min(pos,Q.length),0,{t,tries:cur.tries+1})}
 let d=g==="know"?IV[c.b]:g==="half"?1:0;
 d=Math.min(d,Math.max(1,daysLeft()-2));
 c.due=g==="know"?Date.now()+d*DAY:Date.now()+(g==="half"?DAY:0);
 save();
 const m=document.createElement("div");m.className="msg";m.textContent=msgs[g]+" ("+dt.toFixed(1)+" ث)";$("card").appendChild(m);
 t.forEach((v,k)=>{const r=document.createElement("div");r.className="row";r.innerHTML="<b>"+LN[k]+"</b>";const s=document.createElement("span");s.textContent=v;r.appendChild(s);$("card").appendChild(r)});
 const n=document.createElement("button");n.className="p";n.style.cssText="width:100%;margin-top:12px";n.textContent="التالي";n.onclick=next;$("card").appendChild(n)}

$("dl").value=S.set.dl;$("pd").value=S.set.pd;$("tm").value=S.set.tm;$("cbg").value=S.set.bg;$("cac").value=S.set.ac;
$("dl").onchange=e=>{S.set.dl=e.target.value||S.set.dl;save();home()};
$("pd").onchange=e=>{S.set.pd=+e.target.value||0;save();home()};
$("tm").onchange=e=>{S.set.tm=e.target.value;save()};
$("cbg").oninput=e=>{S.set.bg=e.target.value;theme();save()};$("cac").oninput=e=>{S.set.ac=e.target.value;theme();save()};
document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.set.th=b.dataset.th;theme();save()});
$("nt").onclick=async()=>{try{const p=await Notification.requestPermission();$("nt").textContent=p==="granted"?"الإشعارات مفعّلة ✓":"الإذن مرفوض — فعّله من إعدادات المتصفح"}catch(e){$("nt").textContent="المتصفح لا يدعم الإشعارات"}};
$("addb").onclick=()=>{const rows=$("imp").value.split("\n").map(l=>l.split(/\||\t/).map(x=>x.trim())).filter(r=>r.length>=3&&r[0]&&r[2]);
 const have=new Set(terms().map(key));rows.forEach(r=>{if(!have.has(key(r))){S.extra.push(r.slice(0,3));have.add(key(r))}});$("imp").value="";save();home()};
$("rst").onclick=()=>{if(confirm("متأكد؟ رح يتمسح كل التقدّم.")){S.cards={};S.day={d:today(),n:0};save();home()}};

function remind(){const now=new Date(),[h,m]=S.set.tm.split(":").map(Number);
 if(S.ln!==today()&&(now.getHours()>h||(now.getHours()===h&&now.getMinutes()>=m))){S.ln=today();save();$("nbanner").classList.remove("hide");
  try{if(Notification.permission==="granted")new Notification("مصطلحات التشريح",{body:"اليوم: "+quota()+" كلمة جديدة و"+dueList().length+" للمراجعة"})}catch(e){}}}
theme();home();remind();setInterval(remind,30000);
if("serviceWorker" in navigator){addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}})}
</script>
</body>
</html>
